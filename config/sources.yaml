  - id: gcaptain
    name: "gCaptain"
    home: "https://gcaptain.com/"
    feed: "https://gcaptain.com/feed/"
    tier: 3
    lang: en
    categories: [other]
    license: "転載不可。見出しとURLの記録のみ"
