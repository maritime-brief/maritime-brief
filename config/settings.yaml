# ===========================================================
# SHIPSHIFT（シップシフト） 全体設定
# 書き換えたら保存するだけで、次回の自動実行から反映されます。
# ===========================================================

site:
  name: "SHIPSHIFT"
  name_kana: "シップシフト"
  tagline: "規制・造船・脱炭素。海運の転換点を、日本語で。"
  # 公開後のURL（GitHub Pages なら https://<ユーザー名>.github.io/<リポジトリ名>）
  base_url: "https://maritime-brief.github.io/maritime-brief"
  # 誤りの指摘・削除依頼の受付先（Googleフォームのリンクやメールアドレス）
  contact_url: "mailto:contact@example.com"
  operator_name: "SHIPSHIFT編集部"

# 記事を作る方式
#   claude-app : Claudeのスケジュールされたタスクが記事を書く（APIキー不要。プランの利用枠を使う）
#   api        : GitHub Actions が Claude API で記事を書く（APIキーが必要。月3,000〜5,000円程度）
engine: claude-app

# 公開モード
#   trial : 試験運用。作った記事はすべて「保留」に入り、人が承認したものだけ公開
#   auto  : 検証に合格した記事は自動公開、不合格だけ保留
publish:
  mode: trial

# 使うAIモデル（engine: api のときだけ使用）
models:
  triage: "claude-haiku-5-5"    # 選別
  extract: "claude-sonnet-5-5"  # 事実抽出（誤りが後工程すべてに響くため、上位モデル）
  write: "claude-sonnet-5-5"    # 執筆
  verify: "claude-sonnet-5-5"   # 検証
  fix: "claude-sonnet-5-5"      # 修正
  polish: "claude-sonnet-5-5"   # 推敲
  explain: "claude-sonnet-5-5"  # 用語解説
  explain_check: "claude-sonnet-5-5"  # 用語解説のチェック

# 1回の実行あたりの上限（費用の上限にもなります）
limits:
  items_per_feed: 10          # 1つのソースから読む新着の数
  articles_per_run: 6         # 1回の実行で記事化する最大本数
  min_relevance: 3            # 選別で記事化する重要度の下限（1〜5）
  source_text_max_chars: 15000
  request_interval_sec: 2     # 同じサイトへのアクセス間隔（秒）

# 修正・推敲のループ
revision:
  max_fix_rounds: 3     # 保留になった記事を「修正担当」が直して再検証する最大回数
  polish: true          # 合格した記事を「推敲担当」がさらに良くする（推敲後も合格した場合だけ採用）
  explain: true         # 最終版に「用語解説」と「業界外の方へ」の背景を付ける（業界外の読者向け）
  glossary_backfill_per_run: 3   # 用語解説が付いていない既存の記事に、1回の実行で後付けする件数

# 検証の基準（これを超えた記事は保留になります）
verify:
  translation_likeness_max: 30   # 翻訳らしさ（0〜100）
  structure_similarity_max: 40   # 構成の類似度（0〜100）
  english_run_max_words: 8       # 原文と同じ英単語が何語連続したら保留にするか
  ja_ngram_overlap_max: 0.15     # 日本語ソースとの文字列の重なり（0〜1）
  min_chars: 350                 # 本文の最小文字数
  max_chars: 900                 # 本文の最大文字数
  max_quotes: 1                  # 原文からの引用の最大数
  # 改変を含む再利用が明示的に許されたソース（sources.yaml で adaptation_allowed: true）に使う基準
  relaxed_for_adaptation_allowed:
    translation_likeness_max: 45
    structure_similarity_max: 60

# カテゴリ（信号旗の色で表示）。nav: true のものが上部メニューに出る（重点分野）
categories:
  regulation:   { label: "規制", flag: "regulation", nav: true }
  shipbuilding: { label: "造船", flag: "shipbuilding", nav: true }
  technology:   { label: "脱炭素・新技術", flag: "technology", nav: true }
  safety:       { label: "安全・事故", flag: "safety", nav: false }
  other:        { label: "その他", flag: "other", nav: false }

# アフィリエイト（収益化の段階になったら enabled: true に）
affiliate:
  enabled: false
  # カテゴリごとに記事の末尾へ表示する紹介枠。「PR」表示が自動で付きます。
  items:
    regulation:
      - title: "（例）海事法規の解説書"
        url: "https://example.com/affiliate-link"
        note: "条約と国内法の関係を確認したい方に"
    safety: []
    shipbuilding: []
    technology: []
    other: []
