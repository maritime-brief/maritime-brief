name: probe-sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install feedparser requests
      - name: probe
        run: |
          python - <<'PY' > data/probe.txt 2>&1
          import feedparser, requests, re, urllib.robotparser
          from urllib.parse import urljoin, urlparse
          UA = "MaritimeBriefJP-Bot/0.1 (+news aggregation of public notices; contact via site)"
          S = requests.Session(); S.headers["User-Agent"] = UA
          import collections
          feeds = ["https://www.mpa.gov.sg/feeds/media-releases"]
          pages = [
            "https://www.dnv.com/news/",
            "https://www.lr.org/en/knowledge/press-room/",
            "https://ww2.eagle.org/en/news.html",
            "https://www.zerocarbonshipping.com/news/",
            "https://www.globalmaritimeforum.org/news",
            "https://www.sdir.no/en/news/",
            "https://www.dma.dk/news",
          ]
          for u in feeds:
              r = S.get(u, timeout=30); d = feedparser.parse(r.content)
              print(f"FEED {r.status_code} n={len(d.entries)} {u}")
              for e in d.entries[:6]: print("   -", e.get("title","")[:90], "|", e.get("link",""))
          for u in pages:
              try:
                  r = S.get(u, timeout=30)
                  print(f"PAGE {r.status_code} {u}")
                  anchors = re.findall(r'<a[^>]+href="([^"#]+)"[^>]*>(.*?)</a>', r.text, re.S)
                  seen=set(); n=0
                  for href, txt in anchors:
                      txt = re.sub(r"<[^>]+>|\s+", " ", txt).strip()
                      full = urljoin(u, href)
                      if len(txt) < 35 or full in seen or urlparse(full).netloc != urlparse(u).netloc: continue
                      seen.add(full); n+=1
                      print("   a:", txt[:80], "|", full)
                      if n >= 8: break
              except Exception as e: print("PAGE ERR", u, e)
          PY
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add data/probe.txt; git commit -m "probe" || true; git pull --rebase; git push
