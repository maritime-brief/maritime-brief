    summary: 船が登録されていて、その国の法律に従う国のこと。検査などの責任を負う
    detail: 旗国とは、船が登録されている国のことで、船はその国の国旗を掲げて航行します。船は旗国の法律の下に置かれ、安全や環境、船員の労働に関する国際条約を守らせる責任を旗国が負います。具体的には、船の検査や証書の発行を行い、その一部を船級協会に委ねることもあります。自国民が所有していなくても登録できる国があり、船主は登録費用や規制の内容を見て選ぶため、世界の船の旗国は分散しています。船の国籍のようなものと考えると分かりやすいでしょう。
