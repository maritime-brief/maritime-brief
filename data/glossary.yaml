  第三国港:
    headword: 第三国港
    explanation: EU加盟国ではない国にある港のこと。EUの海運規則では、EU域内の港と域外の港とで、算入する排出量やエネルギーの扱いが変わる。
    status: auto
    added: '2026-10-28'
    aliases:
    - 第三国港
    used_in:
