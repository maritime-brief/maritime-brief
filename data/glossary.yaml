    detail: 船主や船社が造船所に新造船を注文し、契約は済んでいるものの、まだ完成・引き渡しされていない船の合計のこと。隻数や、船の大きさを示す容積の合計で表す。造船所にとっては今後の仕事量の目安になり、船主側から見れば、近い将来に就航する船がどんな種類や燃料の船かを示す指標になる。完成して引き渡されると発注残から減る。調査会社などが定期的に集計しており、船の供給が今後どう増えるかを見通す場面でよく使われる。新造船市場の勢いを測る材料にもなる。
