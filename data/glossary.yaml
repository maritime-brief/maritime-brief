    detail: 船が廃棄物を港の受入施設に引き渡したときに、港側が「確かに受け取りました」と証明して船に渡す書類です。宅配便の受取証のようなものです。どの船から、いつ、どんな種類の廃棄物をどれだけ受け取ったかが書かれます。船にとっては、廃棄物を海に捨てずに陸へ渡した証拠になります。検査や監査で提出を求められることがあり、受領書がないと、適正に処理したことを示しにくくなります。そのため船は、受け取った受領書を一定期間、船内に保管しておくのが一般的です。
