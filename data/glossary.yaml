    summary: 購入から使い終えるまでにかかる費用を合計した総額のこと。
    detail: 総所有コスト（TCO）とは、設備や船を買う代金だけでなく、燃料費、整備費、人件費、保険料など、使い終えるまでにかかる費用をすべて合計したものです。たとえば自動車でいえば、車体価格に加えガソリン代や車検代まで含めた総額にあたります。船は何十年も使うため、購入価格が安くても燃料代が高ければ、結果的に全体では割高になることがあります。異なる燃料や設備を公平に比べて選ぶ際の基本的な考え方として使われます。
