    detail: 船級協会とは、船が安全に航行できる構造や設備を備えているかを、設計・建造・就航後の定期検査を通じて確かめる民間の第三者機関です。自動車でいえば、車検を行う専門機関にあたります。協会は独自の技術規則を定め、基準に合った船に「船級」を与えます。保険会社や荷主は船級を持つことを信頼の目安にし、国の代わりに条約の検査を行う場合もあります。新しい燃料や技術を船に載せる際の審査役としても重要な存在です。船主はその審査を受けて船を運航します。
