    original: Dry Dock
    summary: 水を抜いて船底まで点検・修理できる、船のための大きな設備
    detail: ドライドックは、船を入れたあとに水を排出して、船を水のない状態で支えられるようにした造船所の設備です。船は普段、水に浸かっている部分が多く、船底やプロペラ、舵、船体の外板は外から見ることも直すこともできません。そこで定期的にこの設備へ入れ、塗装のやり直し、傷や腐食の補修、部品の交換などを行います。人間でいえば精密検査や手術のための入院に近いものです。船の安全を保ち、法令で求められる検査を受けるうえで欠かせない設備で、大型船に対応できるものは数が限られます。
