    detail: プレジャーボートは、貨物や旅客を運んで収入を得る商船とは違い、釣りやクルージングなどの楽しみのために使う船です。ヨットやモーターボートがこれにあたり、個人や団体が所有します。船の規則は、大型の商船を主な対象として作られることが多く、小型の漁船やプレジャーボートは、設備や運航の実態が違うため、規則の適用から外されたり、緩やかな基準が設けられたりする場合があります。規則を読むときは、どの船が対象でどの船が除外かを確認することが大切です。
