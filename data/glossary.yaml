# 用語辞書。記事の「用語解説」欄とサイトの用語集に使われます。
# 解説を直したら status を approved にしてください（AIが上書きしなくなります）。
terms:
  AER:
    headword: 年次排出量報告書（AER）
    status: auto
    added: '2026-10-28'
    aliases:
    - 年次排出量報告書（AER）
    used_in:
    - 20261028-dnv-800a211afad7
    original: Annual Emissions Report
    summary: 1年間の温室効果ガス排出量をまとめて当局に出す報告書のこと
    detail: AERは、事業者が1年間に出した温室効果ガスの量を集計し、監督する当局へ提出する報告書です。排出量取引のように排出に値段がつく制度では、この数字が「どれだけ排出枠を返すか」「いくら負担するか」を決める根拠になります。そのため、提出前に独立した第三者の検証機関が内容をチェックするのが一般的です。家計でいえば、1年分の収支をまとめた確定申告書のようなものです。船会社にとっては、燃料の使用量などの記録を日ごろから正確に残し、期限までに報告をそろえる実務が求められます。
    related:
    - EU MRV
    - EMP
    reading: ねんじはいしゅつりょうほうこくしょ
  AiP:
    headword: 基本設計承認（AiP）
    status: approved
    added: '2026-10-28'
    aliases:
    - AiP
    - 基本設計承認
    used_in:
    - 20261027-dnv-90337fad18e5
    original: Approval in Principle
    summary: 新しい船や設備の設計が、基準に沿って実現できそうかを確かめる初期の承認
    detail: AiPは、新しい船や設備の設計について、船級協会などの第三者機関が「定められた安全基準や技術要件に照らして、原則として実現できる見込みがある」と確認する初期段階の証書です。船の「車検」にあたる本格的な承認ではなく、構想や基本設計の段階で出る「お墨付きの第一歩」にあたります。アンモニア燃料船のように前例の少ない船を造るとき、船主や造船所は早い段階で課題を洗い出し、投資判断や次の設計に進む材料にできます。ただし、AiPを得ても詳細設計の承認や建造の許可が出たわけではありません。
    related:
    - 船級協会
    - HAZID
    reading: きほんせっけいしょうにん
  CII:
    headword: CII（炭素強度指標）
    status: auto
    added: '2026-10-28'
    aliases:
    - CII
    used_in:
    - 20261027-lloyds-register-5e0798b98585
    original: Carbon Intensity Indicator
    summary: 船が貨物を運ぶ際のCO2排出効率を、A〜Eの5段階で格付けする指標
    detail: CIIは、船が1年間の運航で、貨物を一定の距離運ぶのにどれだけCO2を出したかを表す指標です。国際海事機関（IMO）が定め、船の大きさや種類ごとの基準に照らして、最も良いAから最も悪いEまでの5段階で格付けします。自動車の燃費表示に近い考え方です。低い評価が続いた船には、改善のための計画を作って提出することが求められます。速度を落とす、航路を工夫する、船体を清掃するなど、運航の工夫でも評価は変わるため、既存の船のCO2削減を進める仕組みとして位置づけられています。
    related:
    - IMO
    - EEXI
  EEA協定:
    headword: EEA協定（欧州経済領域協定）
    status: auto
    added: '2026-10-28'
    aliases:
    - EEA協定
    used_in:
    - 20261028-sdir-c9537a3baf3e
    original: Agreement on the European Economic Area
    summary: EU非加盟のノルウェーなどが、EUの単一市場に参加できるようにする協定
    detail: EEA協定は、EU加盟国と、EUに入っていないノルウェー、アイスランド、リヒテンシュタインの間で結ばれた協定です。物、サービス、資本、人が国境を越えて自由に動ける「EUの単一市場」に、これらの国も参加できるようにします。その代わり、単一市場に関するEUの規則を自国でも取り入れる必要があります。たとえば、EUが環境や海運に関する新しい規則を作ると、EEAに入っている国にも同じ内容が適用される場合があります。EU規則の対象範囲を考えるとき、EU加盟国だけでなくEEAの国も含まれるかどうかを見分ける手がかりになります。
    related:
    - EU MRV
    - FuelEU Maritime
  EMP:
    headword: 排出モニタリング計画（EMP）
    status: auto
    added: '2026-10-28'
    aliases:
    - 排出モニタリング計画（EMP）
    used_in:
    - 20261028-dnv-800a211afad7
    original: null
    summary: 船ごとに排出量の測り方と記録の方法を決めておく計画書のこと
    detail: EMPは、船ごとに「燃料の使用量や排出量を、どの方法で測り、どう記録し、どう集計するか」をあらかじめ文書にまとめた計画書です。排出量の報告制度では、正しい数字を出すことが前提になるため、測定のやり方を先に決めて第三者の検証機関に確認してもらいます。会社の経理でいえば、帳簿のつけ方を定めた社内ルールのようなものです。船会社は計画に沿って日々の燃料データを残し、年末にそれを集計して報告書にします。計画があることで、船ごとのばらつきや記録ミスを減らし、報告の信頼性を保てます。
    related:
    - EU MRV
    - AER
    reading: はいしゅつもにたりんぐけいかく
  EU MRV:
    headword: EU MRV
    status: auto
    added: '2026-10-28'
    aliases:
    - EU MRV
    used_in:
    - 20261028-dnv-800a211afad7
    original: Monitoring, Reporting and Verification
    summary: EU域内の港に寄る大型船に、排出量の測定・報告・検証を求める制度
    detail: EU MRVは、EU域内の港に出入りする一定の大きさ以上の船に対し、CO2などの排出量を「測り（Monitoring）」「報告し（Reporting）」「第三者に確かめてもらう（Verification）」ことを義務づけるEUの制度です。船会社は船ごとの燃料使用量などを記録し、毎年まとめて提出します。集まったデータは公表され、排出量の実態を把握する土台になります。また、排出に費用を課す仕組みなど、ほかの環境規制を運用するときの基礎データとしても使われます。海運で排出削減の議論を進めるには、まず正確な数字が必要であり、その入口となる制度です。
    related:
    - EMP
    - AER
  FuelEU Maritime:
    headword: FuelEU Maritime
    status: auto
    added: '2026-10-28'
    aliases:
    - FuelEU Maritime
    used_in:
    - 20261028-dnv-800a211afad7
    - 20261028-sdir-c9537a3baf3e
    - 20261027-lloyds-register-5e0798b98585
    original: null
    summary: 船が使う燃料の温室効果ガス強度を段階的に下げさせるEUの規則
    detail: FuelEU Maritimeは、EU域内の港に出入りする船が使う燃料について、エネルギー1単位あたりの温室効果ガス排出量（強度）の上限を定め、それを段階的に厳しくしていくEUの規則です。船の燃料を、重油などから、バイオ燃料やアンモニア、水素など排出の少ないものへ切り替えさせることが狙いです。基準を満たせない船の運航会社には、不足分に応じた罰金が課される仕組みです。燃料の種類を直接の対象にしている点が特徴で、燃料の調達や船の仕様を決める際の判断材料になります。
    related:
    - EU MRV
    - バンカリング
  HAZID:
    headword: ハザード特定（HAZID）
    status: auto
    added: '2026-10-28'
    aliases:
    - HAZID
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
    original: Hazard Identification
    summary: 作業や設備に潜む危険を、事前に関係者で洗い出す安全の手法
    detail: HAZIDは、新しい設備や作業を始める前に、そこに潜む危険（ハザード）を関係者が集まって洗い出す安全評価の手法です。設計者、運航者、安全の専門家などが会議形式で、「どんな事故が起こりうるか」「原因は何か」「どう防ぐか」を一覧にして整理します。実際に事故が起きてから対策を考えるのではなく、起きる前に手を打つのが目的です。燃料に毒性や可燃性のある物質を使う船のように、前例が少なく危険の見通しが立てにくい場合に、とくによく使われます。結果は設計の見直しや運用ルールづくりに生かされます。
    related:
    - HAZOP
    - AiP
    reading: はざーどとくてい
  HAZOP:
    headword: 危険性・操作性の検討（HAZOP）
    status: auto
    added: '2026-10-28'
    aliases:
    - HAZOP
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
    original: Hazard and Operability Study
    summary: 設計や手順の通常からのずれを一つずつ想定し、危険を点検する手法
    detail: HAZOPは、設備の設計や操作の手順について、「流れる量が多すぎたら」「流れが止まったら」「温度が高すぎたら」というように、通常の状態からのずれを一つずつ想定し、そのずれが危険や運転上の問題につながらないかを点検する手法です。専門家のチームが図面や手順書を見ながら、順番に確認していきます。もともと化学プラントなどで広く使われてきた方法で、配管や機器が複雑につながる設備の見落としを減らせます。HAZIDが「どんな危険があるか」を広く洗い出すのに対し、HAZOPは設計の細部を詳しく調べる段階で使われます。
    related:
    - HAZID
    reading: きけんせいそうさせいのけんとう
  ILO漁業労働条約:
    headword: ILO漁業労働条約
    status: auto
    added: '2026-10-28'
    aliases:
    - ILO漁業労働条約
    used_in:
    - 20261028-mca-notices-7c9eaa7b0cdb
    original: Work in Fishing Convention
    summary: 漁船で働く人の労働条件の最低基準を定めた国際労働機関の条約
    detail: ILO漁業労働条約は、国際労働機関（ILO）が定めた、漁船で働く人の労働条件に関する国際条約です。漁船は小さな船が多く、長期間の航海や危険な作業を伴うため、一般の船員向けの基準だけでは守りきれない面があります。この条約は、居住設備の広さや衛生、休息時間、食事、医療、安全といった最低限の基準を示します。条約を結んだ国は、自国の法律や規則に取り入れ、漁船に守らせる必要があります。漁船の労働環境や、外国人船員の待遇が問題になる場面で、国際的なものさしとして参照されます。
    related:
    - ILO
  IMO:
    headword: IMO（国際海事機関）
    status: auto
    added: '2026-10-28'
    aliases:
    - IMO
    used_in:
    - 20261028-dnv-e1ae50dbd145
    original: International Maritime Organization
    summary: 海運の安全や環境のルールを国際的に決める国連の専門機関のこと
    detail: 船の安全確保や海洋汚染の防止について、国際ルールを話し合って決める国連の専門機関です。本部はロンドンにあり、世界の多くの国の政府が加盟しています。決まった条約や規則は、加盟国が自国の法律に取り入れることで実際に効力を持ちます。船は国境をまたいで動くため、国ごとにルールがばらばらでは成り立ちません。そこで世界共通の物差しを作る場として、海運の規制や環境対策のニュースにたびたび登場します。海運のルールづくりの出発点となる組織です。
    related:
    - MEPC
    - SOLAS条約
    - 旗国
  ISM会社:
    headword: ISM会社
    status: auto
    added: '2026-10-28'
    aliases:
    - ISM会社
    used_in:
    - 20261028-dnv-800a211afad7
    original: ISM Company
    summary: 船の安全管理と運航に責任を負う会社として登録された会社のこと
    detail: 船の安全管理と運航の責任者として、国際的な安全管理規則であるISMコードにもとづき届け出られた会社です。船を所有する会社と同じこともあれば、船の管理を専門に請け負う別の会社のこともあります。この会社は、安全の方針づくり、船員の教育、事故やトラブルの報告体制の整備などを担います。船の安全が個人の腕前だけに頼らないよう、会社として仕組みを持たせるための制度で、事故のときには責任の窓口にもなります。船の安全を会社の責任として明確にする点が特徴です。
    related:
    - IMO
    - 船舶管理
    - 旗国
  LNG:
    headword: LNG（液化天然ガス）
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG
    used_in:
    - 20261027-dnv-90337fad18e5
    original: Liquefied Natural Gas
    summary: 天然ガスを冷やして液体にし、運びやすくしたもののこと
    detail: 天然ガスをマイナス160度前後まで冷やして液体にしたものです。液体になると体積が約600分の1になるため、パイプラインのない海の向こうへ船で大量に運べます。日本は天然ガスの多くを輸入に頼っており、発電や都市ガスに使われています。船の燃料としても使え、重油に比べて硫黄酸化物や二酸化炭素が少ないため、環境規制への対応策の一つとして注目されています。ただし極低温で扱うため、専用の設備が必要です。エネルギー輸送でも環境対策でも重要な存在です。
    related:
    - LNG運搬船
    - LNG燃料船
    - バンカリング
  LNG燃料船:
    headword: LNG燃料船
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG燃料船
    used_in:
    - 20261028-lloyds-register-6bdedd90bb8d
    original: LNG-fuelled ship
    summary: 液化天然ガスを燃料に使って走る、環境負荷の低い船のこと
    detail: 重油の代わりに、液化天然ガス（LNG）を主な燃料として走る船です。貨物としてLNGを運ぶ船とは別のもので、コンテナ船や自動車運搬船、客船など様々な船種があります。LNGは重油より燃やしたときの硫黄酸化物や二酸化炭素が少ないため、環境規制に対応する選択肢として広がってきました。一方で、燃え残ったメタンが大気に出ることが課題とされ、極低温の燃料を積む専用タンクや補給の体制も必要になります。環境対応が進む中で、新造船の選択肢として増えている船です。
    related:
    - LNG
    - 二元燃料エンジン
    - バンカリング
  LNG運搬船:
    headword: LNG運搬船
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG運搬船
    used_in:
    - 20261028-lloyds-register-bd3229ead371
    original: LNG carrier
    summary: 液化天然ガスを専用タンクで海上輸送する特殊な船のこと
    detail: 天然ガスをマイナス160度前後に冷やして液体にしたLNGを、断熱性の高い専用タンクに積んで海上輸送する船です。産出国の液化基地で積み込み、消費国の受け入れ基地へ届けます。極低温の液体を安全に運ぶ高度な技術が必要で、一般的な貨物船より建造費が高く、造れる造船所も限られます。パイプラインで結べない国同士のエネルギー供給を支える存在で、エネルギー安全保障の面でも重要な船種です。数が限られる、特殊で高価な船種として知られています。
    related:
    - LNG
    - LNG燃料船
    - 造船所
  MAIB:
    headword: MAIB（英国海難調査局）
    status: auto
    added: '2026-10-28'
    aliases:
    - MAIB
    used_in:
    - 20261027-maib-2324868cf013
    original: Marine Accident Investigation Branch
    summary: 英国の船舶事故の原因を調べ、再発防止を促す政府の調査機関のこと
    detail: 英国の領海内の事故や、英国船籍の船が関わる事故を調べる政府の調査機関です。運輸省に属しますが、事故の調査については独立して行われます。目的は誰かの責任や罰則を決めることではなく、何が起きたのかを明らかにして、同じ事故を防ぐ提言を出すことです。調査結果は報告書として公開され、船会社や規制当局が安全対策を見直す材料になります。海外の事故調査機関にも同様の考え方の組織があります。事故から学ぶ姿勢が重視される機関です。
    related:
    - IMO
    - 旗国
  MEPC:
    headword: MEPC（海洋環境保護委員会）
    status: auto
    added: '2026-10-28'
    aliases:
    - MEPC
    used_in:
    - 20261028-lloyds-register-6bdedd90bb8d
    original: Marine Environment Protection Committee
    summary: 船による環境汚染の対策ルールを話し合うIMOの委員会のこと
    detail: 国連の専門機関であるIMOの中に置かれた委員会の一つで、船が引き起こす海や大気の汚染を防ぐルールを議論します。油や廃棄物による海洋汚染、排ガス中の硫黄酸化物や窒素酸化物、温室効果ガスの削減などが主な議題です。加盟国の代表が集まって会合を開き、条約の改正案などを審議します。ここで合意された内容が各国の法律に反映されていくため、船の環境規制の方向性を知るうえで注目される場です。海運の脱炭素の議論でも中心的な役割を担います。
    related:
    - IMO
    - MARPOL条約
    - 温室効果ガス
  MSN:
    headword: MSN（Merchant Shipping Notice）
    status: auto
    added: '2026-10-28'
    aliases:
    - MSN
    used_in:
    - 20261028-mca-notices-7c9eaa7b0cdb
    original: Merchant Shipping Notice
    summary: 英国の海事当局が規則の内容や守り方を知らせる通知のこと
    detail: 英国の海事当局である海事沿岸警備庁が出す通知文書で、商船に関する規則の内容や、その守り方を船主や船員などに分かりやすく伝えるためのものです。国際条約を英国の法令に取り入れたときに、どの船が対象か、何を満たす必要があるかを具体的に示す役割があります。法令そのものとは別に、実務の手引きとして使われます。英国船や英国の港に関わる事業者は、これを確認して自船が規則に合っているか判断します。英国の規則への対応を考えるときに参照される文書です。
    related:
    - IMO
    - 旗国
  Recognized Organization:
    headword: 認定機関（Recognized Organization）
    status: auto
    added: '2026-10-28'
    aliases:
    - Recognized Organization
    used_in:
    - 20261028-dnv-9c74c7c97e97
    original: Recognized Organization
    summary: 旗国に代わって船の検査や証書の発行を行う船級協会などの機関のこと
    detail: 船は登録された国（旗国）の政府が、安全や環境の基準に合っているか検査し、証書を出す決まりです。しかし政府がすべての船を世界中で検査するのは難しいため、その仕事を代わりに任せる機関が認定機関で、多くは船級協会が務めます。略してROと呼ばれます。どの機関を認めるかは旗国ごとに決まります。いわば、国の代わりに船の車検を行う民間の検査機関のようなもので、船の安全を支える仕組みの一つです。検査の質を保つため、旗国は機関を監督します。
