    detail: 貨物槽（カーゴタンク）とは、タンカーや液化ガス運搬船などで、原油や液化ガス、化学品といった液体の貨物を積み込んで保つための船内のタンクです。貨物の性質に合わせて、材質や構造、温度や圧力の管理方法が大きく変わります。たとえば液化天然ガス（LNG）は零下160度前後の超低温のため、断熱構造で包まれた専用のタンクが使われます。漏れや破損は大事故につながるため、タンクの設計は船の安全性と積める量を左右する中心的な要素です。
