    summary: 船の荷役や燃料補給などを、同じ時間帯に重ねて行う作業のこと
    detail: SIMOPSは、停泊中の船で荷物の積み降ろし、燃料の補給、乗組員の交代、点検といった複数の作業を同時に進めることです。港に船が留まる時間を短くでき、船会社にとっては運航の効率が上がります。一方で、可燃性の燃料を扱う作業と荷役が重なると、火花や漏れによる事故の危険が高まります。そのため港や船、燃料供給者が事前に手順を取り決め、立ち入り範囲や連絡方法を確認してから実施します。新しい燃料が増えるほど、どの作業を同時にしてよいかの判断が重要になります。
