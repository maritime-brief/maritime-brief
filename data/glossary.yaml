    summary: 従来の重油ではなく、LNGやメタノールなどで走れる船のこと
    detail: 船は長く重油を燃やして走ってきたが、二酸化炭素などの排出を減らすため、重油以外の燃料を使える船が増えている。LNG、メタノール、アンモニア、バイオ燃料、水素などが代表例で、燃料ごとにエンジンや燃料タンク、安全対策が異なる。船が実際に走れるかは寄港先で燃料を補給できるかにも左右されるため、船の建造と燃料を供給する港の整備が並行して進む必要がある。燃料の選択は、船の価格や運航費にも関わる重要な判断になる。
