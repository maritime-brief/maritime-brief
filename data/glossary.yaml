  総トン数:
    headword: 総トン数
    explanation: 船の内部の容積をもとに決める、船の大きさを表す指標。貨物の重さではない。規則の対象になる船を分ける基準としてよく使われる。
    status: auto
    added: '2026-10-28'
    aliases:
    - 総トン
    used_in:
