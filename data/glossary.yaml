    detail: 旗国当局とは、船が登録されている国（旗国）の政府機関のことです。国際条約を自国の法律に取り入れ、その国に登録された船が安全や環境の基準を満たしているかを検査し、合格した船に証書を発行します。実際の検査は、専門知識を持つ船級協会などの機関に代行させることも多く、その場合も最終的な責任は旗国当局にあります。日本では国土交通省がこの役割を担います。新しい技術の船を認めるかどうかも、ここが判断します。事故が起きたときの調査にも関わります。
