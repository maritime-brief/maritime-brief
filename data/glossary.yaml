    detail: 有能海員は、船の甲板部で働く部員のうち、所定の訓練と乗船経験を積み、見張り・操舵・係留作業などを任される熟練者のこと。略称はAB。船員は、船長や航海士など指揮をとる「職員」と、その指示で実務を担う「部員」に分かれ、有能海員は部員の中で技能が認められた上位の層にあたる。要件は国際条約のSTCW条約が最低基準を定め、各国が自国の規則で証書の取得条件を決める。船社にとっては、安全な当直体制を組むうえで、乗せる船員がこの資格を持つかどうかが重要な確認事項になる。
