    detail: 海上安全委員会（MSC）とは、国際海事機関（IMO）の中にある主要な委員会の一つで、船の安全と保安に関する規則や指針を審議し、採択する役割を持ちます。船の構造や設備、航行の安全、危険物の運送などが対象で、SOLAS条約の改正もここで扱われます。専門分野ごとの小委員会がまとめた案は、この委員会で承認されて初めて確定します。加盟国の代表が集まって決めるため、世界の船に共通するルールの方向性を左右する場になります。
