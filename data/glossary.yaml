    summary: 海に浮かべた台に風車を載せて発電する方式のこと。深い海にも置ける
    detail: 浮体式洋上風力とは、海に浮かべた大きな台（浮体）の上に風車を載せ、ワイヤーや鎖で海底につなぎ止めて発電する方式です。従来の洋上風力は風車の土台を海底に直接打ち込むため、水深が浅い場所に限られました。浮体式なら水深の深い沖合にも設置でき、強く安定した風を利用できます。設置や保守では、浮体の曳航や作業員の輸送など多くの専用船が必要になり、海運や造船にとっても新しい需要の分野です。海底に固定しない分、設置できる範囲が広がります。
