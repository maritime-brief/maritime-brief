    summary: 配管を流れる液体や気体の質量を直接測る計器のこと。
    detail: 質量流量計（MFM）とは、配管の中を流れる液体や気体が、単位時間にどれだけの質量かを直接測る計器です。体積で測る流量計は、温度や圧力で体積が変わると誤差が出ますが、質量で測れば環境の影響を受けにくくなります。燃料の補給のように、受け渡した量に応じて代金を決める場面では、量を正確に記録することが取引の公正さを支えます。特に液化ガスのように温度で体積が大きく変わる燃料では、質量での計量が重視されます。
