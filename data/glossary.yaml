    detail: 船橋ウイングとは、船の操縦室（船橋）の左右両端から船の外側へ張り出した、屋根付きの通路状の部分です。操縦室の中からは船体のすぐ横が見えにくいため、ここに出て船の側面や岸壁までの距離を直接確認します。主に接岸や離岸のときに使われ、船長や水先人（港で船を案内する専門家）がここで指示を出します。大きな船ほど船体が長く幅も広いので、安全に岸壁へ着けるために欠かせない、操船の見張りの場所です。陸上の作業員との合図や連絡にも使われます。
