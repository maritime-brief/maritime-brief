  浮体式洋上風力:
    headword: 浮体式洋上風力
    explanation: 海に浮かべた土台の上に風車を載せて発電する方式。海底に直接固定できない深い海でも設置でき、沿岸の水深が深い国で注目されている。
    status: auto
    added: '2026-10-28'
    aliases:
    - 浮体式洋上風力
    used_in:
