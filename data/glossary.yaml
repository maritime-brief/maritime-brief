  貨物槽:
    headword: 貨物槽（カーゴタンク）
    explanation: 船の中で貨物を積んで保つタンク。LNG運搬船では超低温の液体を断熱して閉じ込める必要があり、船の安全性と積載量を左右する中心的な設備になる。
