    original: Third-country port
    summary: EU加盟国ではない国にある港のこと。EUの規則では域内の港と区別される。
    detail: 第三国港とは、EU加盟国の外にある港のことです。EUの海運向け環境規制は、EU域内の港に出入りする船を対象にしますが、域内の港と域外の港とで扱いが異なります。たとえばEU域内と第三国港を行き来する航海は、排出量などの算入の範囲が域内どうしの航海と変わります。規制を免れる抜け道を防ぎつつ、域外の国との摩擦も抑えるための線引きです。船社が航路ごとの負担を見積もるうえで、港がどちら側にあるかが重要な前提になります。
