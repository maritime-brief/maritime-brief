    original: Air Lubrication System
    summary: 船底から空気の泡を出して水の抵抗を減らす省エネ装置のこと
    detail: 空気潤滑システムとは、船の底に取り付けた吹き出し口から空気の泡を送り出し、船体と水の間に空気の層をつくって摩擦抵抗を減らす省エネ装置です。水より空気のほうが摩擦が小さいため、同じ速さで進むのに必要なエンジンの力が減り、燃料の消費と二酸化炭素の排出を抑えられます。送風機などで空気を送る電力は必要ですが、全体では燃費が良くなります。新造船のほか、既存船への後付けも検討される、環境規制への対応策の一つです。
    related:
    - EEDI
    - 省エネ装置
    - 燃費
    reading: くうきじゅんかつしすてむ
