    summary: 船が出した廃棄物を港で受け取り、陸で処理するための設備や体制のこと
    detail: 船は航海中に、油を含む汚れた水、ごみ、汚水などの廃棄物を出します。これを海に捨てると海洋汚染になるため、港に専用の受け取り設備を置き、船から陸へ引き渡して処理する仕組みが必要です。これが港湾受入施設です。設備を整えるのは港の管理者や事業者で、船は寄港先でそこに廃棄物を渡します。引渡しのたびに受領書が出されるのが一般的です。足りない港があると、船が廃棄物を抱えたまま航海せざるを得ず、不法な排出につながりかねません。
