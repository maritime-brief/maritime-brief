    summary: 船の内部空間の大きさを表す指標で、重さではなく容積から決まる数値のこと
    detail: 総トン数は、船の閉じた内部空間の容積をもとに、国際的な決まりで計算する大きさの目安です。船の重さそのものではありません。船の規則では、この数値を基準に「300総トン以上の船にはこの義務を課す」というように、対象を線引きすることがよくあります。目安として、日本の沿岸を走る小型の貨物船には499総トンの船が多く、外航の大型コンテナ船は十数万総トンに達します。300総トンは、外洋を航行する船としては小型の部類です。
