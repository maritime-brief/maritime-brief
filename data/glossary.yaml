    detail: 冗長性とは、機器の一部が壊れても全体の機能を保てるよう、予備の装置や別の経路をあらかじめ用意しておく設計の考え方です。船ではエンジンや発電機、操舵装置、配電系統などを二重にして、片方が止まってももう片方で動かせるようにします。洋上では修理も救助もすぐには呼べないため、航行を続けて安全な港まで着けることが重要になります。航空機の予備の操縦系統や、病院の非常用電源と同じ発想です。無駄に見えても、いざというときの保険として働きます。
