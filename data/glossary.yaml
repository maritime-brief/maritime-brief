    summary: 外国船が入港した際、港のある国が安全などを確かめる立入検査
    detail: 寄港国検査とは、外国の船が自国の港に入ったときに、港のある国の当局が船に立ち入り、国際条約で定められた安全、環境、船員の労働条件などの基準を守っているかを確かめる検査です。船の登録国による検査だけでは目が届きにくいため、各国が補う形で行われます。問題が見つかれば改善を求められ、重大な場合は出港を止められます。基準に満たない船を海から減らす、いわば最後の関門の役割を持ちます。検査官は書類の確認に加え、船内の設備や居住環境も見て回ります。
