    summary: 船の甲板部で、職員の指示を受けて働く船員のこと
    detail: 船の乗組員は、大きく船長や航海士などの「職員」と、その指示を受けて実務を担う「部員」に分かれる。部門としては、船の操縦や荷役、係留を受け持つ甲板部と、機関の運転や整備を受け持つ機関部がある。甲板部部員は、甲板部で働く部員の総称で、見張りや操舵の補助、係留作業、甲板の保守などを担当する。このうち、より高い技能が認められた人が有能海員（AB）にあたる。国際条約のSTCW条約は、部員にも訓練や資格の基準を設けている。
