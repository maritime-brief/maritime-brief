  概念設計:
    headword: 概念設計
    explanation: 船の大きさ、推進方式、主要な設備など、全体の方向性を決める設計の初期段階。詳細な図面を作る前に、実現できるかや安全性、採算を確かめる役割がある。
    status: auto
    added: '2026-10-28'
    aliases:
