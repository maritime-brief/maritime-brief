  ドロップイン燃料:
    headword: ドロップイン（ドロップイン燃料）
    reading: null
    original: Drop-in fuel
    summary: 今の船や設備を改造せず、そのまま使える代替燃料のこと
    detail: 性質が従来の重油や軽油に近く、エンジンや燃料タンク、配管などを大きく変えずに使える燃料のこと。既存の燃料に混ぜて使うこともできる。バイオ燃料の一部がこれにあたる。LNGやメタノールのように専用の設備を備えた船が必要な燃料と違い、今ある船にそのまま使えるため、導入しやすい。ただし、原料の確保や供給量、価格が課題になることがある。環境対応と運用のしやすさを両立しやすい点が評価されている。既存の船を活かして排出を減らす手段として使われる。
