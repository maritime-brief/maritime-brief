    original: Hybrid Electric Propulsion
    summary: 発電機と電池の電気でモーターを回し、船を進める方式のこと
    detail: ハイブリッド電気推進は、船のプロペラを電気モーターで回し、その電気を発電機用エンジンやバッテリーなど複数の電源から供給する方式です。従来のように大きなエンジンが直接プロペラを回すのではなく、電気を介して力を伝えます。低速で走るときや港で停まっているときは電池を使い、高速で走るときは発電機を使うといった切り替えができ、エンジンを効率のよい状態で動かしやすくなります。結果として燃料消費や排出ガス、騒音を抑えられるため、フェリーや作業船、各種の特殊船で採用が進んでいます。
