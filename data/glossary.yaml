    detail: 防舷材とは、船が岸壁や桟橋に着くとき、あるいは船どうしが横づけするときに、船体と相手との間に挟んで衝撃をやわらげるクッション材です。ゴム製が多く、岸壁に固定して使うほか、船側に吊り下げて使う種類もあります。船は非常に重く、わずかな速度でも接触の力は大きくなるため、防舷材が衝撃を吸収して船体と設備の損傷を防ぎます。港や船の安全な作業を支える、目立たないが基本的な設備です。大型船用には大きな円筒形やパネル形のものもあります。
