    original: Low-flashpoint Fuel
    summary: 火がつきやすい温度が低く、燃えやすい燃料の総称のこと
    detail: 引火点とは、燃料から出る蒸気に火を近づけたときに燃え出す、最も低い温度のことです。船の国際的な安全ルールでは、引火点が60度未満の燃料を低引火点燃料と呼び、重油より火がつきやすいため特別な扱いを求めています。LNGやメタノール、アンモニアなどが代表例で、環境負荷の小さい燃料として注目されています。ガソリンを扱うときと同じように慎重さが必要で、漏れの検知、換気、燃料タンクの配置、乗組員の訓練といった対策を船の設計と運航の両面で整えることが求められます。
