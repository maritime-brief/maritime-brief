  海上安全委員会:
    headword: 海上安全委員会（MSC）
    explanation: IMOの中で、船の安全に関する規則や指針を審議し、採択や承認を行う委員会。下部の小委員会がまとめた案も、ここでの承認を経て確定する。
    status: auto
    added: '2026-10-28'
    aliases:
