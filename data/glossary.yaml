    summary: 常温で液体の化学品で、船の代替燃料として使われるもの
    detail: 化学工業で広く使われる、無色透明の液体。常温で液体のため、LNGのように極低温に冷やさずに運べ、タンクや補給設備を比較的作りやすい。燃やしたときの硫黄分が少なく、天然ガスやバイオマス、再生可能エネルギー由来の電力などからも作れるため、船の代替燃料として注目される。一方で重油より引火しやすく毒性もあるので、専用のエンジンと安全対策が欠かせない。海運では、LNGと並んで導入が進む選択肢の一つとされる。
