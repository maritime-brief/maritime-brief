    detail: 喫水線とは、船が水に浮かんだときに船体の外板と水面が接する線のことです。荷物や燃料を積むと船は沈み、降ろすと浮き上がるため、喫水線の位置は積載量によって変わります。船体の側面には、積める荷の限度を示す満載喫水線の印などが描かれ、積みすぎを防ぎます。喫水線より下の外板に損傷が生じると海水が流れ込むため、船の安全や浮力を考える際の基準になる大切な位置です。積載の管理や検査でも、この線の位置が確認されます。
