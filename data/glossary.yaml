    summary: 排出量に上限を設け、排出枠の売買で温室効果ガスを減らす仕組みのこと。
    detail: 排出量取引制度（ETS）とは、国や地域が温室効果ガスの排出できる総量に上限を決め、その分の「排出枠」を企業に割り当てる仕組みです。排出が枠を超える企業は、枠が余った企業から買って埋め合わせます。排出を減らすほど費用が浮くため、削減への動機づけになります。欧州連合や英国などがそれぞれ制度を運用しており、海運もその対象に含められる動きがあります。船社にとっては、排出量がそのまま費用に結びつく点が特徴です。
