    summary: EUが海運の排出量データを集めるために使う電子システムのこと
    detail: Thetis-MRVは、欧州海上安全機関（EMSA）が運営する、船のCO2排出量などの報告を扱うオンラインの仕組みです。MRVとは、排出量を測る（Monitoring）、報告する（Reporting）、第三者が確認する（Verification）という一連の流れを指します。EUの港に出入りする大型船の運航者は、燃料の使用量や航海の情報をまとめ、確認を受けたうえでこのシステムに提出します。当局はそのデータを集めて排出状況を把握し、規制の運用に生かします。海運の環境規制では、データを正しく集めて報告することが出発点になります。
