  総所有コスト:
    headword: 総所有コスト（TCO）
    explanation: 船や設備を買う代金だけでなく、燃料費、整備費、運航にかかる費用なども含め、使う期間全体で必要になる費用の合計。方式どうしを公平に比べる物差しになる。
    status: auto
    added: '2026-10-28'
    aliases:
    - 総所有コスト
    used_in:
    - 20261028-lloyds-register-bd3229ead371
  船橋ウイング:
    headword: 船橋ウイング
    explanation: 船の操縦室（船橋）の両側に張り出した通路状の部分。ここから船の側面や岸壁との距離を直接確認でき、接岸や補給作業の見張りに使われます。
