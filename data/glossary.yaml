    original: Ballast
    summary: 船の安定を保つために積む、海水などの重りのこと。船の釣り合いを取る
    detail: バラストは、船の重心や傾き、前後の釣り合いを整えるために積む重りで、多くは専用のタンクに入れた海水が使われます。船は荷物を積んでいないと軽く浮き上がりすぎて不安定になり、荷物の積み方によっては傾きも生じます。そこで荷物の量や配置に合わせてバラスト水を出し入れし、船の姿勢と安全を保ちます。人間が荷物を背負うとき、重さの偏りで体を傾けて均衡を取るのに似ています。なお、バラスト水を各地の海へ排出すると、生き物が運ばれて生態系に影響する問題があり、国際的なルールで管理されています。
