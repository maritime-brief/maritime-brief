# 用語辞書。記事の「用語解説」欄とサイトの用語集に使われます。
# 解説を直したら status を approved にしてください（AIが上書きしなくなります）。
terms:
  AER:
    headword: 年次排出量報告書（AER）
    status: auto
    added: '2026-10-28'
    aliases:
    - 年次排出量報告書（AER）
    used_in:
    - 20261028-dnv-800a211afad7
    original: Annual Emissions Report
    summary: 1年間の温室効果ガス排出量をまとめて当局に出す報告書のこと
    detail: AERは、事業者が1年間に出した温室効果ガスの量を集計し、監督する当局へ提出する報告書です。排出量取引のように排出に値段がつく制度では、この数字が「どれだけ排出枠を返すか」「いくら負担するか」を決める根拠になります。そのため、提出前に独立した第三者の検証機関が内容をチェックするのが一般的です。家計でいえば、1年分の収支をまとめた確定申告書のようなものです。船会社にとっては、燃料の使用量などの記録を日ごろから正確に残し、期限までに報告をそろえる実務が求められます。
    related:
    - EU MRV
    - EMP
  AiP:
    headword: 承認原則（AiP）
    status: auto
    added: '2026-10-28'
    aliases:
    - 承認原則
    used_in:
    - 20261027-dnv-90337fad18e5
    original: Approval in Principle
    summary: 新しい船や設備の設計が、基準に沿って実現できそうかを確かめる初期の承認
    detail: AiPは、新しい船や設備の設計について、船級協会などの第三者機関が「定められた安全基準や技術要件に照らして、原則として実現できる見込みがある」と確認する初期段階の証書です。船の「車検」にあたる本格的な承認ではなく、構想や基本設計の段階で出る「お墨付きの第一歩」にあたります。アンモニア燃料船のように前例の少ない船を造るとき、船主や造船所は早い段階で課題を洗い出し、投資判断や次の設計に進む材料にできます。ただし、AiPを得ても詳細設計の承認や建造の許可が出たわけではありません。
    related:
    - 船級協会
    - HAZID
  CII:
    headword: CII（炭素強度指標）
    status: auto
    added: '2026-10-28'
    aliases:
    - CII
    used_in:
    - 20261027-lloyds-register-5e0798b98585
    original: Carbon Intensity Indicator
    summary: 船が貨物を運ぶ際のCO2排出効率を、A〜Eの5段階で格付けする指標
    detail: CIIは、船が1年間の運航で、貨物を一定の距離運ぶのにどれだけCO2を出したかを表す指標です。国際海事機関（IMO）が定め、船の大きさや種類ごとの基準に照らして、最も良いAから最も悪いEまでの5段階で格付けします。自動車の燃費表示に近い考え方です。低い評価が続いた船には、改善のための計画を作って提出することが求められます。速度を落とす、航路を工夫する、船体を清掃するなど、運航の工夫でも評価は変わるため、既存の船のCO2削減を進める仕組みとして位置づけられています。
    related:
    - IMO
    - EEXI
  EEA協定:
    headword: EEA協定（欧州経済領域協定）
    status: auto
    added: '2026-10-28'
    aliases:
    - EEA協定
    used_in:
    - 20261028-sdir-c9537a3baf3e
    original: Agreement on the European Economic Area
    summary: EU非加盟のノルウェーなどが、EUの単一市場に参加できるようにする協定
    detail: EEA協定は、EU加盟国と、EUに入っていないノルウェー、アイスランド、リヒテンシュタインの間で結ばれた協定です。物、サービス、資本、人が国境を越えて自由に動ける「EUの単一市場」に、これらの国も参加できるようにします。その代わり、単一市場に関するEUの規則を自国でも取り入れる必要があります。たとえば、EUが環境や海運に関する新しい規則を作ると、EEAに入っている国にも同じ内容が適用される場合があります。EU規則の対象範囲を考えるとき、EU加盟国だけでなくEEAの国も含まれるかどうかを見分ける手がかりになります。
    related:
    - EU MRV
    - FuelEU Maritime
  EMP:
    headword: 排出モニタリング計画（EMP）
    status: auto
    added: '2026-10-28'
    aliases:
    - 排出モニタリング計画（EMP）
    used_in:
    - 20261028-dnv-800a211afad7
    original: null
    summary: 船ごとに排出量の測り方と記録の方法を決めておく計画書のこと
    detail: EMPは、船ごとに「燃料の使用量や排出量を、どの方法で測り、どう記録し、どう集計するか」をあらかじめ文書にまとめた計画書です。排出量の報告制度では、正しい数字を出すことが前提になるため、測定のやり方を先に決めて第三者の検証機関に確認してもらいます。会社の経理でいえば、帳簿のつけ方を定めた社内ルールのようなものです。船会社は計画に沿って日々の燃料データを残し、年末にそれを集計して報告書にします。計画があることで、船ごとのばらつきや記録ミスを減らし、報告の信頼性を保てます。
    related:
    - EU MRV
    - AER
  EU MRV:
    headword: EU MRV
    status: auto
    added: '2026-10-28'
    aliases:
    - EU MRV
    used_in:
    - 20261028-dnv-800a211afad7
    original: Monitoring, Reporting and Verification
    summary: EU域内の港に寄る大型船に、排出量の測定・報告・検証を求める制度
    detail: EU MRVは、EU域内の港に出入りする一定の大きさ以上の船に対し、CO2などの排出量を「測り（Monitoring）」「報告し（Reporting）」「第三者に確かめてもらう（Verification）」ことを義務づけるEUの制度です。船会社は船ごとの燃料使用量などを記録し、毎年まとめて提出します。集まったデータは公表され、排出量の実態を把握する土台になります。また、排出に費用を課す仕組みなど、ほかの環境規制を運用するときの基礎データとしても使われます。海運で排出削減の議論を進めるには、まず正確な数字が必要であり、その入口となる制度です。
    related:
    - EMP
    - AER
  FuelEU Maritime:
    headword: FuelEU Maritime
    status: auto
    added: '2026-10-28'
    aliases:
    - FuelEU Maritime
    used_in:
    - 20261028-dnv-800a211afad7
    - 20261028-sdir-c9537a3baf3e
    - 20261027-lloyds-register-5e0798b98585
    original: null
    summary: 船が使う燃料の温室効果ガス強度を段階的に下げさせるEUの規則
    detail: FuelEU Maritimeは、EU域内の港に出入りする船が使う燃料について、エネルギー1単位あたりの温室効果ガス排出量（強度）の上限を定め、それを段階的に厳しくしていくEUの規則です。船の燃料を、重油などから、バイオ燃料やアンモニア、水素など排出の少ないものへ切り替えさせることが狙いです。基準を満たせない船の運航会社には、不足分に応じた罰金が課される仕組みです。燃料の種類を直接の対象にしている点が特徴で、燃料の調達や船の仕様を決める際の判断材料になります。
    related:
    - EU MRV
    - バンカリング
  HAZID:
    headword: ハザード特定（HAZID）
    status: auto
    added: '2026-10-28'
    aliases:
    - HAZID
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
    original: Hazard Identification
    summary: 作業や設備に潜む危険を、事前に関係者で洗い出す安全の手法
    detail: HAZIDは、新しい設備や作業を始める前に、そこに潜む危険（ハザード）を関係者が集まって洗い出す安全評価の手法です。設計者、運航者、安全の専門家などが会議形式で、「どんな事故が起こりうるか」「原因は何か」「どう防ぐか」を一覧にして整理します。実際に事故が起きてから対策を考えるのではなく、起きる前に手を打つのが目的です。燃料に毒性や可燃性のある物質を使う船のように、前例が少なく危険の見通しが立てにくい場合に、とくによく使われます。結果は設計の見直しや運用ルールづくりに生かされます。
    related:
    - HAZOP
    - AiP
  HAZOP:
    headword: 危険性・操作性の検討（HAZOP）
    status: auto
    added: '2026-10-28'
    aliases:
    - HAZOP
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
    original: Hazard and Operability Study
    summary: 設計や手順の通常からのずれを一つずつ想定し、危険を点検する手法
    detail: HAZOPは、設備の設計や操作の手順について、「流れる量が多すぎたら」「流れが止まったら」「温度が高すぎたら」というように、通常の状態からのずれを一つずつ想定し、そのずれが危険や運転上の問題につながらないかを点検する手法です。専門家のチームが図面や手順書を見ながら、順番に確認していきます。もともと化学プラントなどで広く使われてきた方法で、配管や機器が複雑につながる設備の見落としを減らせます。HAZIDが「どんな危険があるか」を広く洗い出すのに対し、HAZOPは設計の細部を詳しく調べる段階で使われます。
    related:
    - HAZID
  ILO漁業労働条約:
    headword: ILO漁業労働条約
    status: auto
    added: '2026-10-28'
    aliases:
    - ILO漁業労働条約
    used_in:
    - 20261028-mca-notices-7c9eaa7b0cdb
    original: Work in Fishing Convention
    summary: 漁船で働く人の労働条件の最低基準を定めた国際労働機関の条約
    detail: ILO漁業労働条約は、国際労働機関（ILO）が定めた、漁船で働く人の労働条件に関する国際条約です。漁船は小さな船が多く、長期間の航海や危険な作業を伴うため、一般の船員向けの基準だけでは守りきれない面があります。この条約は、居住設備の広さや衛生、休息時間、食事、医療、安全といった最低限の基準を示します。条約を結んだ国は、自国の法律や規則に取り入れ、漁船に守らせる必要があります。漁船の労働環境や、外国人船員の待遇が問題になる場面で、国際的なものさしとして参照されます。
    related:
    - ILO
  IMO:
    headword: IMO（国際海事機関）
    explanation: 国際海事機関の略。海運の安全や環境保護について国際ルールを決める国連の専門機関で、加盟国はそのルールを国内の法令に取り入れる。
    status: auto
    added: '2026-10-28'
    aliases:
    - IMO
    used_in:
    - 20261028-dnv-e1ae50dbd145
  ISM会社:
    headword: ISM会社
    explanation: ISMコード（国際安全管理規則）に基づき、船の安全管理と運航に責任を負う会社。船主とは別の会社のこともあり、船舶管理の窓口になる。
    status: auto
    added: '2026-10-28'
    aliases:
    - ISM会社
    used_in:
    - 20261028-dnv-800a211afad7
  LNG:
    headword: LNG（液化天然ガス）
    explanation: 天然ガスをマイナス160度前後まで冷やして液体にした燃料。体積が小さくなり運びやすく、重油より硫黄酸化物や二酸化炭素が少ないため、船の燃料にも使われます。
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG
    used_in:
    - 20261027-dnv-90337fad18e5
  LNG燃料船:
    headword: LNG燃料船
    explanation: 液化天然ガス（LNG）を燃料に使う船。重油より燃焼時の硫黄酸化物や二酸化炭素が少ないが、燃え残ったメタンが出ることが課題とされる。
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG燃料船
    used_in:
    - 20261028-lloyds-register-6bdedd90bb8d
  LNG運搬船:
    headword: LNG運搬船
    explanation: 天然ガスをマイナス160度前後に冷やして液体（LNG）にし、専用のタンクで運ぶ船。ガスを海外から届けるエネルギー輸送を支える、特殊で高価な船種。
    status: auto
    added: '2026-10-28'
    aliases:
    - LNG運搬船
    used_in:
    - 20261028-lloyds-register-bd3229ead371
  MAIB:
    headword: MAIB（英国海難調査局）
    explanation: 英国で起きた船の事故などを調べる政府の調査機関。責任追及ではなく原因を究明し、再発防止の提言を出すことが目的。
    status: auto
    added: '2026-10-28'
    aliases:
    - MAIB
    used_in:
    - 20261027-maib-2324868cf013
  MEPC:
    headword: MEPC（海洋環境保護委員会）
    explanation: IMOの中で、船による海洋汚染や大気汚染、温室効果ガスの対策ルールを議論する委員会。環境規制の改正はここで審議される。
    status: auto
    added: '2026-10-28'
    aliases:
    - MEPC
    used_in:
    - 20261028-lloyds-register-6bdedd90bb8d
  MSN:
    headword: MSN（Merchant Shipping Notice）
    explanation: 英国の海事当局が、商船や漁船に関わる規則の内容や守り方を関係者に知らせるために出す通知。規則の適用範囲や求める事項を示す。
    status: auto
    added: '2026-10-28'
    aliases:
    - MSN
    used_in:
    - 20261028-mca-notices-7c9eaa7b0cdb
  Recognized Organization:
    headword: 認定機関（Recognized Organization）
    explanation: 旗国の政府から、船の検査や証書の発行などを代わりに行うことを認められた船級協会などの機関。略称はRO。認める機関は国ごとに決まる。
    status: auto
    added: '2026-10-28'
    aliases:
    - Recognized Organization
    used_in:
    - 20261028-dnv-9c74c7c97e97
  RoPaxフェリー:
    headword: RoPaxフェリー
    explanation: トラックや乗用車が自力で乗り降りでき、旅客も運ぶフェリーのこと。車両用の甲板を持ち、物流と人の移動の両方を支える船種。
    status: auto
    added: '2026-10-28'
    aliases:
    - RoPaxフェリー
    used_in:
    - 20261027-maib-2324868cf013
  SIMOPS:
    headword: 同時作業（SIMOPS）
    explanation: 荷役と燃料補給など、複数の作業を同時に進めること。時間を節約できる一方、作業同士が干渉しないよう安全面の調整が欠かせない。
    status: auto
    added: '2026-10-28'
    aliases:
    - SIMOPS
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
  Thetis-MRV:
    headword: Thetis-MRV
    explanation: 欧州海上安全機関（EMSA）が運営する、EUの海運の排出量報告用の電子システム。船社の報告の提出や、当局による確認に使われる。
    status: auto
    added: '2026-10-28'
    aliases:
    - Thetis-MRV
    used_in:
    - 20261028-sdir-c9537a3baf3e
  デュアルフューエル:
    headword: デュアルフューエル
    explanation: 2種類の燃料を使い分けられるエンジンや船のこと。重油などの従来燃料と別の燃料を切り替えて使え、環境規制への対応策として注目される。
    status: auto
    added: '2026-10-28'
    aliases:
    - デュアルフューエル
    used_in:
    - 20261028-mpa-singapore-b80ef6f5b9d7
  ドライドック:
    headword: ドライドック
    explanation: 水を抜いて船を陸上のような状態で置ける、船の修理や点検のための設備。水中にある船底や破損部分を直接調べて直せる。
    status: auto
    added: '2026-10-28'
    aliases:
    - ドライドック
    used_in:
    - 20261027-maib-2324868cf013
  ハイブリッド電気推進:
    headword: ハイブリッド電気推進
    explanation: 発電機やバッテリーなど複数の電源から供給した電気でモーターを回し、プロペラを動かす方式。運航状況に合わせて電源を使い分け、燃料の無駄を減らしやすい。
    status: auto
    added: '2026-10-28'
    aliases:
    - ハイブリッド電気推進
    used_in:
    - 20261028-lloyds-register-bd3229ead371
  バラスト:
    headword: バラスト
    explanation: 船の傾きや前後の釣り合い、安定を調整するため、専用タンクに出し入れする海水などの重し。積荷の状況に合わせて船の姿勢を保つ。
    status: auto
    added: '2026-10-28'
    aliases:
    - バラスト
    used_in:
    - 20261027-maib-2324868cf013
  バンカリング:
    headword: バンカリング
    explanation: 船に燃料を補給すること。燃料供給船や陸上の施設から船へ燃料を送るため、燃料の種類ごとに安全な手順や設備が求められる。
    status: auto
    added: '2026-10-28'
    aliases:
    - バンカリング
    used_in:
    - 20261028-dnv-e1ae50dbd145
    - 20261028-mpa-singapore-b80ef6f5b9d7
    - 20261027-dnv-90337fad18e5
  メタンスリップ:
    headword: メタンスリップ
    explanation: エンジンで燃やしきれなかったメタンが、排ガスとして大気中に漏れ出る現象。メタンは強力な温室効果ガスなので、LNG燃料船の環境性能を左右する。
    status: auto
    added: '2026-10-28'
    aliases:
    - メタンスリップ
    used_in:
    - 20261028-lloyds-register-6bdedd90bb8d
  低引火点燃料:
    headword: 低引火点燃料
    explanation: 火がつきやすい（引火点が低い）燃料の総称。メタノールやLNGなどが含まれ、漏れや火災を防ぐための特別な設計や取り扱いが必要になる。
    status: auto
    added: '2026-10-28'
    aliases:
    - 低引火点燃料
    used_in:
    - 20261028-dnv-e1ae50dbd145
  係留・位置保持システム:
    headword: 係留・位置保持システム
    explanation: 海に浮かぶ設備が流されないよう、チェーンやロープなどで海底につないで位置を保つ仕組み。浮体式設備の安全を支える重要な部分。
    status: auto
    added: '2026-10-28'
    aliases:
    - 係留・位置保持システム
    used_in:
    - 20261028-dnv-9c74c7c97e97
  冗長性:
    headword: 冗長性（じょうちょうせい）
    explanation: 機器の一部が故障しても船が動き続けられるよう、予備の装置や別の経路をあらかじめ備えておく考え方。洋上では助けを呼びにくいため、安全のうえで重要になる。
    status: auto
    added: '2026-10-28'
    aliases:
    - 冗長性
    used_in:
    - 20261028-lloyds-register-bd3229ead371
  喫水線:
    headword: 喫水線（きっすいせん）
    explanation: 船が水に浮かんだとき、船体と水面が接する線。この線より下に穴が開くと海水が入るため、船の安全上とても重要な位置。
    status: auto
    added: '2026-10-28'
    aliases:
    - 喫水線
    used_in:
    - 20261027-maib-2324868cf013
  寄港国検査:
    headword: 寄港国検査
    explanation: 外国の船が自国の港に入ったときに、その国の当局が、船が国際的な安全や労働条件などの基準を満たしているかを確かめる検査。基準に満たない船を減らす役割がある。
    status: auto
    added: '2026-10-28'
    aliases:
    - 寄港国検査
    used_in:
    - 20261028-mca-notices-7c9eaa7b0cdb
  旗国:
    headword: 旗国
    explanation: 船が登録されている国のこと。船は旗国の法律の下に置かれ、安全や環境の基準を満たしているかの検査や承認は旗国が責任を持つ。
    status: auto
    added: '2026-10-28'
    aliases:
