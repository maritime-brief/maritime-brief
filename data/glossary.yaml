    original: Methane Slip
    summary: 燃え残ったメタンが、排ガスとして大気に漏れ出す現象のこと
    detail: メタンスリップとは、LNG（液化天然ガス）を燃料にするエンジンで、燃料の主成分であるメタンが燃えきらないまま排ガスと一緒に外へ出てしまう現象です。メタンは燃やすとCO2の排出が少なく済む燃料ですが、燃やさずに大気へ出ると、同じ量のCO2よりもずっと強く地球を温める温室効果ガスとして働きます。そのため、LNG燃料船は燃焼時のCO2が少なくても、メタンスリップが多いと温暖化対策としての利点が小さくなります。エンジンの方式ごとにスリップ量は異なり、減らす技術の開発や評価方法の整備が進められています。
