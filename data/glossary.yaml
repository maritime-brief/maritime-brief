    summary: 海に浮かぶ設備が流されないよう、位置を保つ仕組みのこと
    detail: 係留・位置保持システムは、洋上に浮かぶ設備が潮流や風、波で流されないよう、決められた場所にとどめるための仕組みです。代表的なのは、鎖やロープ、合成繊維の綱を海底のアンカーなどにつなぐ方法で、洋上風力発電の浮体や海上の石油・ガス設備で使われます。ほかに、船体のスラスターを自動制御で動かして位置を保つ方法もあります。船を港の岸壁にロープで留める作業を、沖合の大規模な設備に置き換えたようなものです。切れたり緩んだりすると設備の損傷や衝突につながるため、設計や点検が重視されます。
