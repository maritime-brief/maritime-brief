  英国ETS:
    headword: 排出量取引制度（ETS）
    explanation: 排出できる量に上限を決め、排出枠を企業どうしで売り買いさせて温室効果ガスを減らす仕組み。英国にも独自の制度があり、排出枠が足りなければ購入が必要になる。
