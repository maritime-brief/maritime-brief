    - 20261028-mca-notices-7c9eaa7b0cdb
  旗国当局:
    headword: 旗国当局
    explanation: 船が登録されている国（旗国）の政府機関。船の安全や環境の基準を定めて検査や証書発行を行い、その一部を船級協会に任せることもある。
    status: auto
    added: '2026-10-28'
    aliases:
    - 旗国当局
    used_in:
