    original: Dual-Fuel
    summary: 2種類の燃料を切り替えて使えるエンジンや、その船のこと
    detail: デュアルフューエルとは、重油などの従来の燃料と、LNG（液化天然ガス）やメタノールなど別の燃料の、二つを使い分けられるエンジンやそれを積んだ船のことです。一方の燃料が手に入りにくい港でも、もう一方で運航を続けられます。環境に配慮した燃料の供給体制が十分でない間は、新燃料への移行期に採用されやすい方式です。ただし燃料ごとのタンクや配管、安全対策が必要になり、船の建造費や設計の手間は増えます。燃料の種類によっては、燃え残りの排出など別の環境上の課題も出ます。
