    detail: 暫定指針とは、新しい技術や燃料を船で安全に使うために、正式な条約や規則が整うまでの間、国際機関が仮の基準として示す指針のことです。海事分野では国際海事機関（IMO）が作成します。規則の改正には長い議論と手続きが必要なため、技術の普及に安全面が追いつくよう先に目安を示す役割があります。法的な強制力は限られますが、各国や船主はこれを参考に設計や運航を進め、実際の経験を踏まえて見直され、のちに正式な規則へ発展することもあります。
