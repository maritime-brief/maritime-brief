    reading: null
    original: Ammonia
    summary: 燃やしても二酸化炭素を出さない、船の次世代燃料候補
    detail: 窒素と水素からなる化合物で、肥料の原料として世界中で大量に作られ、運ばれている。燃やしても二酸化炭素が出ないため、船の次世代燃料の候補になっている。一方で毒性と腐食性があり、燃えにくくエンジンで安定して燃やす技術も発展途上にある。このため船に使うには、漏れを防ぐ設備や乗組員の訓練、補給時の安全対策などを整える必要がある。船の燃料としては、実用化に向けた試験や安全の枠組みづくりが各国で進む段階にある。
