    reading: つうたつ
    original: null
    summary: 行政機関が関係者に、規則の解釈や運用方法を知らせる文書のこと。
    detail: 通達とは、行政機関が関係する事業者や職員に対し、法律や規則をどう解釈し、どう運用するかを知らせる文書である。法律そのものではなく、規則の読み方や実務上の扱いを示す手引きの性質を持つ。守る義務の根拠は法律や規則の本体にあり、通達はそれを具体的にどう満たすかを説明する。海事の分野では、国や当局が船主や船員の雇用者に向けて出すことが多い。海外の当局が出す案内文書も、日本語ではこの語で訳されることがある。
