    original: Bunkering
    summary: 船に燃料を補給すること。自動車のガソリン給油に当たる作業
    detail: バンカリングとは、船が航海に使う燃料を港や沖合で補給する作業のことです。バンカーは船の燃料を指す言葉で、燃料の供給は専用の燃料供給船が船に横付けする方法、陸上の設備からホースで送る方法、タンクローリーから積む方法などで行われます。船は一度に大量の燃料を積み、長い距離を走るため、どこで補給できるかは航路や港の競争力に影響します。LNGやメタノールのような新しい燃料では、燃料ごとに安全な手順や設備、扱える人材が必要になり、供給体制づくりが課題とされています。
