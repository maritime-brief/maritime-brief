    summary: 港で船を横付けして荷役や燃料補給をする岸壁の区画のこと
    detail: 港の岸壁のうち、船1隻が着けて停泊できるように区切られた場所のこと。船はバースに係留して、貨物の積み降ろしや乗組員の乗り降り、燃料の補給などを行う。バースごとに水深や設備、周囲の状況が違うため、どの船が使えるかや、どんな作業が安全にできるかもバースによって変わる。燃料補給のような危険を伴う作業では、バース単位で安全性を評価し、手順を決めておくことが重要になる。港の能力を数えるときの単位にもなる。なお、バース数が多いほど同時に受け入れられる船も増える。
