    summary: STCW条約で、甲板部の部員と有能海員の基準を定める章
    detail: STCW条約は、船員の訓練・資格・当直の国際的な最低基準を定めた条約で、内容が章ごとに分かれている。このうち第II章は、船長と甲板部に関する基準を扱う。その中の第II/4章は、航海当直に加わる部員の基準、第II/5章は有能海員の基準にあたる。各国は、この章の内容を自国の規則に取り入れ、証書の取得に必要な訓練や経験を定める。そのため、各国の通達や規則が「STCW条約の第II/4章に基づく」などと書くときは、この国際基準に沿った訓練であることを示している。
