    detail: 総トン数とは、船体の内部にある密閉された空間の容積をもとに、一定の計算式で出す船の大きさの指標です。貨物の重さではなく、いわば船の「かさ」を表します。国際条約で測り方が定められており、国や船種を問わず同じ物差しで比べられます。船の安全や環境に関する規則では、「総トン数5000トン以上の船」のように、規則を適用する船を分ける基準として広く使われます。港の使用料や登録の手数料の計算に用いられることもあります。
